[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "emovoice"
version = "2.0.0"
description = "An emotion-aware desktop voice assistant"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
emovoice = "emovoice.__main__:main"

[tool.setuptools]
packages = ["emovoice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
